name: Sync Kotlin Types to milky-kt-types

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to sync, such as `v1.2.0`. Leave empty to use the latest tag.
        required: false
        type: string

jobs:
  generate-and-sync:
    name: Generate Kotlin Types and Sync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Milky
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Resolve Milky tag and version
        id: milky-version
        shell: bash
        run: |
          set -euo pipefail

          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            RESOLVED_TAG="$INPUT_TAG"
          else
            git fetch --tags --force
            RESOLVED_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          fi

          if [ -z "$RESOLVED_TAG" ]; then
            echo "Failed to resolve a Milky tag." >&2
            exit 1
          fi

          MILKY_VERSION="${RESOLVED_TAG#v}"
          echo "Resolved tag: $RESOLVED_TAG"
          echo "Resolved version: $MILKY_VERSION"

          echo "resolved_tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "milky_version=$MILKY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Kotlin Types
        run: |
          cd common
          npx milky-common generate kotlin/kotlinx-serialization ../Types.kt

      - name: Checkout milky-kt-types
        uses: actions/checkout@v4
        with:
          repository: SaltifyDev/milky-kt-types
          token: ${{ secrets.KT_TYPES_TOKEN }}
          path: milky-kt-types
          ref: main

      - name: Copy generated file and update version
        run: |
          mkdir -p milky-kt-types/src/commonMain/kotlin/org/ntqqrev/milky
          cp Types.kt milky-kt-types/src/commonMain/kotlin/org/ntqqrev/milky/Types.kt

          MILKY_VERSION="${{ steps.milky-version.outputs.milky_version }}"
          echo "Updating version to $MILKY_VERSION"

          sed -i 's/^version = ".*"/version = "'$MILKY_VERSION'"/' milky-kt-types/build.gradle.kts

      - name: Commit and Push if changed
        run: |
          cd milky-kt-types
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(deps): Bump to Milky ${{ steps.milky-version.outputs.milky_version }}"
            git push origin main

            git tag ${{ steps.milky-version.outputs.resolved_tag }}
            git push origin ${{ steps.milky-version.outputs.resolved_tag }}
            echo "Successfully synced to milky-kt-types!"
          else
            echo "No changes detected in generated Kotlin types. Skipping push."
          fi
