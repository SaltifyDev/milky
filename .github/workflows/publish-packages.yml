name: Publish protocol and types packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate package versions
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.validate.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate package versions
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const protocolPkg = JSON.parse(fs.readFileSync('protocol/package.json', 'utf8'));
          const typesPkg = JSON.parse(fs.readFileSync('types/package.json', 'utf8'));

          if (protocolPkg.version !== typesPkg.version) {
            throw new Error(
              `protocol version ${protocolPkg.version} does not match types version ${typesPkg.version}.`,
            );
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_version=${protocolPkg.version}\n`);
          console.log(`Validated matching package version ${protocolPkg.version}.`);
          NODE

  publish:
    name: Publish ${{ matrix.package_dir }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - protocol
          - types
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Ensure npm is up to date
        run: pnpm install -g npm@latest

      - name: Publish package
        shell: bash
        working-directory: ${{ matrix.package_dir }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          npm_tag="latest"
          if [[ "$version" == *-* ]]; then
            npm_tag="rc"
          fi

          pnpm publish --tag "$npm_tag"